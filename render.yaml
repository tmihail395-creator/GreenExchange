services:
  - type: web
    name: greenexchange
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn website.wsgi:application --workers 2 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: greenexchange-db
          property: connectionString
      - key: COINGECKO_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: greenexchange-db
    plan: free
