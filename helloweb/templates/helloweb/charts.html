{% extends 'helloweb/base.html' %}

{% block title %}Charts{% endblock %}

{% block content %}
<h1 class="section-title">Crypto charts</h1>

<div id="chartRoot" data-url="{% url 'chart_data' code='XXX' days=0 %}">

    <!-- Выбор монеты -->
    <div class="chart-tabs" id="coinTabs">
        {% for c in coins %}
            <button type="button" class="chart-tab {% if forloop.first %}active{% endif %}" data-coin="{{ c.code }}" data-name="{{ c.name }}">{{ c.code }}</button>
        {% endfor %}
    </div>

    <div class="chart-card">
        <div class="chart-head">
            <div>
                <div id="chartTitle" class="chart-title">Bitcoin (BTC)</div>
                <div class="chart-price"><span id="chartPrice">—</span><span id="chartChange"></span></div>
            </div>

            <!-- Выбор периода -->
            <div class="chart-ranges" id="rangeTabs">
                <button type="button" class="chart-tab" data-days="1">24H</button>
                <button type="button" class="chart-tab active" data-days="7">7D</button>
                <button type="button" class="chart-tab" data-days="30">30D</button>
                <button type="button" class="chart-tab" data-days="90">90D</button>
                <button type="button" class="chart-tab" data-days="365">1Y</button>
            </div>
        </div>

        <div class="chart-canvas">
            <canvas id="priceChart"></canvas>
            <div id="chartStatus" class="chart-status">Loading…</div>
        </div>
    </div>

    <p class="text-soft small mt-3">Price history in USD. Data by CoinGecko, cached for up to 15 minutes.</p>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
(function () {
    const root     = document.getElementById('chartRoot');
    const urlTpl   = root.dataset.url;
    const canvas   = document.getElementById('priceChart');
    const statusEl = document.getElementById('chartStatus');
    const priceEl  = document.getElementById('chartPrice');
    const changeEl = document.getElementById('chartChange');
    const titleEl  = document.getElementById('chartTitle');

    const PERIODS = { 1: '24h', 7: '7d', 30: '30d', 90: '90d', 365: '1y' };

    let coin = document.querySelector('#coinTabs .chart-tab.active').dataset.coin;
    let days = 7;
    let chart = null;
    let reqId = 0;

    function fmtPrice(n) {
        if (n >= 1000) return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
        if (n >= 1)    return '$' + n.toFixed(2);
        return '$' + n.toFixed(4);
    }

    function axisLabel(ts) {
        const d = new Date(ts);
        if (days === 1) return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    function fullLabel(ts) {
        return new Date(ts).toLocaleString('en-GB', {
            day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
    }

    function draw(points) {
        const labels = points.map(p => axisLabel(p[0]));
        const titles = points.map(p => fullLabel(p[0]));
        const values = points.map(p => p[1]);

        const first = values[0];
        const last  = values[values.length - 1];
        const pct   = (last - first) / first * 100;
        const up    = pct >= 0;
        const color = up ? '#6afc60' : '#ff6b6b';

        priceEl.textContent  = fmtPrice(last);
        changeEl.textContent = (up ? '+' : '') + pct.toFixed(2) + '% · ' + PERIODS[days];
        changeEl.className   = up ? 'up' : 'down';

        if (chart) chart.destroy();
        chart = new Chart(canvas, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: values,
                    borderColor: color,
                    backgroundColor: up ? 'rgba(106, 252, 96, 0.12)' : 'rgba(255, 107, 107, 0.12)',
                    borderWidth: 2,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    tension: 0.25,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#0c1210',
                        borderColor: 'rgba(125, 158, 150, 0.4)',
                        borderWidth: 1,
                        titleColor: '#f2f7f4',
                        bodyColor: color,
                        displayColors: false,
                        callbacks: {
                            title: items => titles[items[0].dataIndex],
                            label: ctx => fmtPrice(ctx.parsed.y)
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: 'rgba(242, 247, 244, 0.55)', maxTicksLimit: 6, maxRotation: 0 }
                    },
                    y: {
                        grid: { color: 'rgba(125, 158, 150, 0.12)' },
                        ticks: { color: 'rgba(242, 247, 244, 0.55)', callback: v => fmtPrice(v) }
                    }
                }
            }
        });
    }

    async function load() {
        const myReq = ++reqId;
        statusEl.textContent = 'Loading…';
        statusEl.hidden = false;

        try {
            const url = urlTpl.replace('XXX', coin).replace(/\/0$/, '/' + days);
            const res = await fetch(url);
            if (!res.ok) throw new Error('bad status');
            const data = await res.json();
            if (myReq !== reqId) return;      // пришёл устаревший ответ
            draw(data.points);
            statusEl.hidden = true;
        } catch (e) {
            if (myReq !== reqId) return;
            statusEl.textContent = 'Chart data is temporarily unavailable. Please try again in a few minutes.';
            statusEl.hidden = false;
        }
    }

    function activate(container, btn) {
        container.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    document.getElementById('coinTabs').addEventListener('click', e => {
        const btn = e.target.closest('.chart-tab');
        if (!btn) return;
        activate(e.currentTarget, btn);
        coin = btn.dataset.coin;
        titleEl.textContent = btn.dataset.name + ' (' + coin + ')';
        load();
    });

    document.getElementById('rangeTabs').addEventListener('click', e => {
        const btn = e.target.closest('.chart-tab');
        if (!btn) return;
        activate(e.currentTarget, btn);
        days = parseInt(btn.dataset.days, 10);
        load();
    });

    const firstBtn = document.querySelector('#coinTabs .chart-tab.active');
    titleEl.textContent = firstBtn.dataset.name + ' (' + coin + ')';
    load();
})();
</script>
{% endblock %}
